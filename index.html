    <style>
        :root {
            --pa-navy: #053250;
            --pa-navy-deep: #032033;
            --pa-teal: #00C3B4;
            --pa-teal-dark: #00a99c;
            --pa-indigo: #323778;
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(1200px 500px at 10% -10%, rgba(0, 195, 180, 0.22), transparent 55%),
                radial-gradient(900px 400px at 110% 110%, rgba(50, 55, 120, 0.45), transparent 50%),
                linear-gradient(165deg, var(--pa-navy-deep) 0%, var(--pa-navy) 48%, var(--pa-indigo) 100%);
            min-height: 100vh;
        }

        .pa-card {
            background: #ffffff;
            box-shadow: 0 24px 60px rgba(3, 32, 51, 0.35);
        }

        .pa-accent {
            height: 6px;
            background: linear-gradient(90deg, #323778 0%, #00C3B4 100%);
        }

        .pa-input:focus {
            outline: none;
            border-color: var(--pa-teal);
            box-shadow: 0 0 0 3px rgba(0, 195, 180, 0.25);
        }

        .pa-btn {
            background-color: var(--pa-teal);
            color: var(--pa-navy);
        }

        .pa-btn:hover {
            background-color: var(--pa-teal-dark);
        }

        .pa-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 195, 180, 0.35);
        }
    </style>

                    <div>
                        <p class="text-xs font-semibold tracking-[0.2em] uppercase text-[#00a99c]">High Performance</p>
                        <h1 class="mt-1 text-2xl font-bold text-[#053250]">Kayak Cross Analysis</h1>
                        <p class="mt-2 text-sm text-slate-500">Please log in to view the reports.</p>
                    </div>
                </div>

                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-[#053250]">Username</label>
                        <div class="mt-1">
                            <input id="username" name="username" type="text" required
                                   class="pa-input block w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-[#053250]">Password</label>
                        <div class="mt-1">
                            <input id="password" name="password" type="password" required
                                   class="pa-input block w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-md shadow-sm placeholder-slate-400 sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <button type="submit"
                                class="pa-btn w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-semibold transition-colors">
                            Sign in
                        </button>
                    </div>
                </form>

                <div id="error-message" class="hidden text-center text-sm font-medium text-red-600 p-3 bg-red-50 rounded-md border border-red-200">
                    <!-- Error messages will be displayed here -->
                </div>

                <p class="text-center text-xs text-slate-400">Paddle Australia · Kayak Cross</p>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');

        const reportUrl = 'report_code.html';
        const credentialsUrl = 'info_doc.json';

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorMessage.classList.add('hidden');
            const username = usernameInput.value;
            const password = passwordInput.value;
            try {
                const response = await fetch(credentialsUrl);
                if (!response.ok) {
                    throw new Error('Could not load credentials file.');
                }
                const credentials = await response.json();
                if (username === credentials.username && password === credentials.password) {
                    window.location.href = reportUrl;
                } else {
                    errorMessage.textContent = 'Invalid username or password.';
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'An error occurred during login. Please check the console.';
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
